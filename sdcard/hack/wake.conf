# 唤醒门控热机期（毫秒）
#
# 上电后的这段时间内，KWS 仍然检测并记录 HIT，但不会进入对话。
# 用来躲开 afe 电平归一化 / KWS 底噪估计的开机收敛期（收敛前容易误报）。
#
# 当前值 120000（2 分钟）：实测 60 秒会放行开机期的误唤醒，2 分钟是折中。
# 可用范围 0 ~ 600000：
#   0      = 关闭门控，上电立即可唤醒（调试用）
#   60000  = 1 分钟可用，但开机前几分钟可能误唤醒
#   180000 = 旧版行为（3 分钟），最保守
#
# 改完重启 p8s 生效；启动日志会打印 [kws] wake gate = ... ms
# 也可在 telnet 里临时覆盖：WAKE_GATE_MS=0 ./bin/p8s
# 注：卡上没有本文件时，程序内置兜底值为 60000。
WAKE_GATE_MS=120000
